<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
        }
        
        #title {
            text-align: center;
            font-size: 24px;
            color: #f00;

            text-shadow: 2px 2px #800;
            letter-spacing: 3px;
        }
        
        #mainGame {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        #canvasContainer {
            border: 3px solid #fff;
            box-shadow: 0 0 20px #fff;
            background: #000;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #sidebar {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel {
            background: #111;
            border: 2px solid #fff;
            padding: 15px;
            box-shadow: 0 0 10px #fff;
        }
        
        .panel h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid #fff;

            padding-bottom: 5px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;

            font-size: 14px;
        }
        
        .bar {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid #fff;

            margin: 5px 0;
            position: relative;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: #fff;
            transition: width 0.3s;

            box-shadow: 0 0 10px #fff;
        }
        
        .bar-fill.hp { background: #f00; box-shadow: 0 0 10px #f00; }
        
        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;

            line-height: 20px;
            color: #fff;
            font-size: 12px;
            text-shadow: 1px 1px #000;
        }
        
        #messageLog {
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        
        #messageLog::-webkit-scrollbar {
            width: 8px;
        }
        
        #messageLog::-webkit-scrollbar-track {
            background: #111;
        }
        
        #messageLog::-webkit-scrollbar-thumb {
            background: #fff;
            border: 1px solid #333;
        }
        
        .message {
            margin: 3px 0;
            padding: 2px;
        }
        
        .message.damage { color: #f00; }


        .message.heal { color: #0ff; }
        .message.info { color: #ff0; }
        .message.death { color: #f0f; }
        
        #controls {
            font-size: 12px;
            line-height: 1.6;
        }
        
        #controls kbd {
            background: #333;
            border: 1px solid #fff;
            padding: 2px 5px;

            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        #gameOver {
            position: fixed;
            top: 50%;

            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 4px solid #f00;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px #f00;
            z-index: 1000;
            display: none;

        }
        
        #gameOver.show { display: block; }
        #gameOver.win { border-color: #fff; box-shadow: 0 0 50px #fff; }
        
        #gameOver h2 {
            font-size: 36px;
            color: #f00;
            margin-bottom: 20px;
            text-shadow: 3px 3px #000;
        }
        
        #gameOver.win h2 { color: #fff; }
        
        #gameOver button {
            background: #fff;
            color: #000;


            border: 2px solid #fff;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        #gameOver button:hover {
            background: #000;
            color: #fff;
        }
        
        .legend {
            font-size: 11px;
            line-height: 1.6;
            margin-top: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-char {
            font-weight: bold;
            font-size: 14px;
            width: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="title">⚔ DUNGEON CRAWLER ⚔</div>
        
        <div id="mainGame">
            <div id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
            </div>
            
            <div id="sidebar">
                <div class="panel">
                    <h2>⚔ PLAYER STATS</h2>
                    <div class="stat">
                        <span>Level:</span>
                        <span id="level">1</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill hp" id="hpBar" style="width: 100%"></div>
                        <div class="bar-text" id="hpText">100/100</div>
                    </div>
                    <div class="stat">
                        <span>Attack:</span>
                        <span id="attack">5</span>
                    </div>
                    <div class="stat">
                        <span>Defense:</span>
                        <span id="defense">2</span>
                    </div>
                    <div class="stat">
                        <span>Kills:</span>
                        <span id="kills">0</span>
                    </div>
                    <div class="stat">


                        <span>Depth:</span>
                        <span id="depth">1</span>
                    </div>
                </div>
                
                <div class="panel">
                    <h2> MESSAGE LOG</h2>
                    <div id="messageLog"></div>
                </div>
                
                <div class="panel">
                    <h2> CONTROLS</h2>
                    <div id="controls">
                        <kbd>↑↓←→</kbd> Move<br>
                        <kbd>Space</kbd> Wait<br>
                        <kbd>R</kbd> New Game<br><br>
                        <div class="legend">
                            <div class="legend-item">
                                <span class="legend-char" style="color: #ff0;">@</span>
                                <span>You</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #f00;">G</span>
                                <span>Goblin</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #f0f;">O</span>
                                <span>Orc</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #0a0;">T</span>
                                <span>Troll (Deadly!)</span>
                            </div>
                            <div class="legend-item">


                                <span class="legend-char" style="color: #0ff;">!</span>
                                <span>Health Potion</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #ff0;">></span>
                                <span>Stairs (Exit)</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    
    <div id="gameOver">
        <h2 id="gameOverTitle">GAME OVER</h2>
        <p id="gameOverText"></p>
        <button onclick="game.newGame()">Play Again</button>


    </div>

    <script>
        const TILE_SIZE = 12;
        const MAP_WIDTH = 60;
        const MAP_HEIGHT = 40;
        const FOV_RADIUS = 8;
        //monsterss n surroundings

        const TILES = {


            FLOOR: '.',

            WALL: '#',
            PLAYER: '@',
            GOBLIN: 'G',
            ORC: 'O',
            POTION: '!',
            STAIRS: '>'
        };
        
//monsterscolors

        const COLORS = {
            floor: '#333',
            wall: '#666',
            player: '#ff0',
            goblin: '#f00',
            orc: '#f0f',
            troll: '#0a0',
            potion: '#0ff',
            stairs: '#ff0',
            fog: '#111',

            explored: '#222'
        };

        

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = MAP_WIDTH * TILE_SIZE;

                this.canvas.height = MAP_HEIGHT * TILE_SIZE;
                
                this.messageLog = [];
                this.newGame();
                this.setupInput();
                this.render();
            }
            

            newGame() {
                this.map = this.generateDungeon();
                this.explored = Array(MAP_HEIGHT).fill().map(() => Array(MAP_WIDTH).fill(false));
                this.visible = Array(MAP_HEIGHT).fill().map(() => Array(MAP_WIDTH).fill(false));
                
                const startRoom = this.rooms[0];
                this.player = {
                    x: startRoom.centerX,
                    y: startRoom.centerY,
                    hp: 120,
                    maxHp: 120,
                    attack: 8,

                    defense: 4,
                    level: 1,
                    kills: 0
                };
                


                this.depth = 1;
                this.entities = [];
                this.items = [];
                this.gameOverFlag = false;
                
                

                const lastRoom = this.rooms[this.rooms.length - 1];
                this.stairs = { x: lastRoom.centerX, y: lastRoom.centerY };
                
                
                this.spawnEntities();

                

                this.messageLog = [];
                this.addMessage('Welcome to the dungeon! Find the stairs to descend deeper...', 'info');
                
                document.getElementById('gameOver').className = '';

                this.updateUI();
                this.calculateFOV();
                this.render();
            }
            
            generateDungeon() {

                const map = Array(MAP_HEIGHT).fill().map(() => Array(MAP_WIDTH).fill('#'));
                this.rooms = [];
                
                const NUM_ROOMS = 8 + Math.floor(Math.random() * 5);
                
                for (let i = 0; i < NUM_ROOMS; i++) {
                    const w = 5 + Math.floor(Math.random() * 8);
                    const h = 4 + Math.floor(Math.random() * 6);


                    const x = Math.floor(Math.random() * (MAP_WIDTH - w - 2)) + 1;

                    const y = Math.floor(Math.random() * (MAP_HEIGHT - h - 2)) + 1;
                    
                    const newRoom = {
                        x, y, w, h,
                        centerX: Math.floor(x + w / 2),
                        centerY: Math.floor(y + h / 2)
                    };
                    


                    let overlap = false;
                    for (let room of this.rooms) {
                        if (this.roomsOverlap(newRoom, room)) {
                            overlap = true;
                            break;
                        }
                    }
                    

                    
                    if (!overlap) {
                        this.carveRoom(map, newRoom);
                        
                        if (this.rooms.length > 0) {

                            const prevRoom = this.rooms[this.rooms.length - 1];

                            this.carveCorridor(map, prevRoom.centerX, prevRoom.centerY, 
                                             newRoom.centerX, newRoom.centerY);
                        }
                        
                        this.rooms.push(newRoom);
                    }
                }
                
                return map;
            }

            
            roomsOverlap(room1, room2) {
                return !(room1.x + room1.w < room2.x - 1 || 

                        room1.x > room2.x + room2.w + 1 ||

                        room1.y + room1.h < room2.y - 1 || 
                        room1.y > room2.y + room2.h + 1);

            }
            
            carveRoom(map, room) {
                for (let y = room.y; y < room.y + room.h; y++) {

                    for (let x = room.x; x < room.x + room.w; x++) {

                        if (x >= 0 && x < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT) {

                            map[y][x] = '.';
                        }
                    }
                }
            }
            
            carveCorridor(map, x1, y1, x2, y2) {
                if (Math.random() < 0.5) {
                    


                    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {

                        if (x >= 0 && x < MAP_WIDTH && y1 >= 0 && y1 < MAP_HEIGHT) {
                            map[y1][x] = '.';


                        }
                    }
                    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {

                        if (x2 >= 0 && x2 < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT) {
                            map[y][x2] = '.';

                        }
                    }
                } else {
                    // Vertical then horizontal
                    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {

                        if (x1 >= 0 && x1 < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT) {
                            map[y][x1] = '.';
                        }
                    }
                    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {

                        if (x >= 0 && x < MAP_WIDTH && y2 >= 0 && y2 < MAP_HEIGHT) {
                            map[y2][x] = '.';
                        }


                    }
                }
            }
            
            spawnEntities() {
                const numEnemies = 12 + this.depth * 3;
                const numPotions = 5 + Math.floor(Math.random() * 4);
                

                for (let i = 0; i < numEnemies; i++) {
                    const room = this.rooms[1 + Math.floor(Math.random() * (this.rooms.length - 1))];
                    let x, y, attempts = 0;
                    
                    do {


                        x = room.x + Math.floor(Math.random() * room.w);

                        y = room.y + Math.floor(Math.random() * room.h);
                        attempts++;
                    } while ((this.getEntityAt(x, y) || (x === this.player.x && y === this.player.y)) && attempts < 50);
                    
                    if (attempts < 50) {
                        const roll = Math.random();
                        let type, char, color, hp, attack, defense;
                        
                        if (roll < 0.5) {
                            // Goblin 

                            type = 'goblin';
                            char = TILES.GOBLIN;

                            color = COLORS.goblin;
                            hp = 12 + this.depth * 5;

                            attack = 4 + this.depth * 3;
                            defense = 1 + Math.floor(this.depth / 3);

                        } else if (roll < 0.85) {
                            // orc

                            type = 'orc';
                            char = TILES.ORC;
                            color = COLORS.orc;
                            hp = 25 + this.depth * 8;

                            attack = 6 + this.depth * 4;
                            defense = 3 + Math.floor(this.depth / 2);
                        } else {
                            //trol


                            type = 'troll';
                            char = 'T';
                            color = '#0a0';
                            hp = 40 + this.depth * 12;

                            attack = 8 + this.depth * 5;
                            defense = 4 + Math.floor(this.depth / 2);
                        }


                        
                        this.entities.push({
                            x, y, type, char, color,
                            hp: Math.floor(hp),

                            maxHp: Math.floor(hp),
                            attack: Math.floor(attack),
                            defense
                        });


                    }
                }
                //more potion drop
                for (let i = 0; i < numPotions; i++) {
                    const room = this.rooms[1 + Math.floor(Math.random() * (this.rooms.length - 1))];
                    let x, y, attempts = 0;
                    
                    do {


                        x = room.x + Math.floor(Math.random() * room.w);

                        y = room.y + Math.floor(Math.random() * room.h);
                        attempts++;
                    } while ((this.getEntityAt(x, y) || this.getItemAt(x, y) || 
                             (x === this.player.x && y === this.player.y)) && attempts < 50);
                    
                    if (attempts < 50) {
                        this.items.push({
                            x, y,
                            type: 'potion',

                            char: TILES.POTION,
                            color: COLORS.potion,
                            heal: 30 + Math.floor(Math.random() * 20)
                        });
                    }
                }
            }
        }
