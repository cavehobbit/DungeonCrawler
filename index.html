<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler - A Retro Roguelike</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
        }
        
        #title {
            text-align: center;
            font-size: 24px;
            color: #f00;
            text-shadow: 2px 2px #800;
            letter-spacing: 3px;
        }
        
        #mainGame {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        #canvasContainer {
            border: 3px solid #fff;
            box-shadow: 0 0 20px #fff;
            background: #000;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #sidebar {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel {
            background: #111;
            border: 2px solid #fff;
            padding: 15px;
            box-shadow: 0 0 10px #fff;
        }
        
        .panel h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid #fff;
            padding-bottom: 5px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .bar {
            width: 100%;
            height: 20px;
            background: #222;
            border: 1px solid #fff;
            margin: 5px 0;
            position: relative;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: #fff;
            transition: width 0.3s;
            box-shadow: 0 0 10px #fff;
        }
        
        .bar-fill.hp { background: #f00; box-shadow: 0 0 10px #f00; }
        
        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 20px;
            color: #fff;
            font-size: 12px;
            text-shadow: 1px 1px #000;
        }
        
        #messageLog {
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        
        #messageLog::-webkit-scrollbar {
            width: 8px;
        }
        
        #messageLog::-webkit-scrollbar-track {
            background: #111;
        }
        
        #messageLog::-webkit-scrollbar-thumb {
            background: #fff;
            border: 1px solid #333;
        }
        
        .message {
            margin: 3px 0;
            padding: 2px;
        }
        
        .message.damage { color: #f00; }
        .message.heal { color: #0ff; }
        .message.info { color: #ff0; }
        .message.death { color: #f0f; }
        
        #controls {
            font-size: 12px;
            line-height: 1.6;
        }
        
        #controls kbd {
            background: #333;
            border: 1px solid #fff;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 4px solid #f00;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px #f00;
            z-index: 1000;
            display: none;
        }
        
        #gameOver.show { display: block; }
        #gameOver.win { border-color: #fff; box-shadow: 0 0 50px #fff; }
        
        #gameOver h2 {
            font-size: 36px;
            color: #f00;
            margin-bottom: 20px;
            text-shadow: 3px 3px #000;
        }
        
        #gameOver.win h2 { color: #fff; }
        
        #gameOver button {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        #gameOver button:hover {
            background: #000;
            color: #fff;
        }
        
        .legend {
            font-size: 11px;
            line-height: 1.6;
            margin-top: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-char {
            font-weight: bold;
            font-size: 14px;
            width: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="title">⚔ DUNGEON CRAWLER ⚔</div>
        
        <div id="mainGame">
            <div id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
            </div>
            
            <div id="sidebar">
                <div class="panel">
                    <h2>⚔ PLAYER STATS</h2>
                    <div class="stat">
                        <span>Level:</span>
                        <span id="level">1</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill hp" id="hpBar" style="width: 100%"></div>
                        <div class="bar-text" id="hpText">100/100</div>
                    </div>
                    <div class="stat">
                        <span>Attack:</span>
                        <span id="attack">5</span>
                    </div>
                    <div class="stat">
                        <span>Defense:</span>
                        <span id="defense">2</span>
                    </div>
                    <div class="stat">
                        <span>Kills:</span>
                        <span id="kills">0</span>
                    </div>
                    <div class="stat">
                        <span>Depth:</span>
                        <span id="depth">1</span>
                    </div>
                </div>
                
                <div class="panel">
                    <h2>📜 MESSAGE LOG</h2>
                    <div id="messageLog"></div>
                </div>
                
                <div class="panel">
                    <h2>🎮 CONTROLS</h2>
                    <div id="controls">
                        <kbd>↑↓←→</kbd> Move<br>
                        <kbd>Space</kbd> Wait<br>
                        <kbd>R</kbd> New Game<br><br>
                        <div class="legend">
                            <div class="legend-item">
                                <span class="legend-char" style="color: #ff0;">@</span>
                                <span>You</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #f00;">G</span>
                                <span>Goblin</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #f0f;">O</span>
                                <span>Orc</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #0a0;">T</span>
                                <span>Troll (Deadly!)</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #0ff;">!</span>
                                <span>Health Potion</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-char" style="color: #ff0;">></span>
                                <span>Stairs (Exit)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="gameOver">
        <h2 id="gameOverTitle">GAME OVER</h2>
        <p id="gameOverText"></p>
        <button onclick="game.newGame()">Play Again</button>
    </div>

    <script>
        const TILE_SIZE = 12;
        const MAP_WIDTH = 60;
        const MAP_HEIGHT = 40;
        const FOV_RADIUS = 8;
        
        const TILES = {
            FLOOR: '.',
            WALL: '#',
            PLAYER: '@',
            GOBLIN: 'G',
            ORC: 'O',
            POTION: '!',
            STAIRS: '>'
        };
        
        const COLORS = {
            floor: '#333',
            wall: '#666',
            player: '#ff0',
            goblin: '#f00',
            orc: '#f0f',
            troll: '#0a0',
            potion: '#0ff',
            stairs: '#ff0',
            fog: '#111',
            explored: '#222'
        };
